name: Foundation checks
on:
  push:
    branches: ["feat/foundation"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependency-free unit tests
        run: npm test
      # Initial lockfile generation is pending. Switch to npm ci after review.
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      - name: Express health integration test
        run: npm run test --workspace @ptm/api
      - name: Next.js build
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
