name: Mobile browser preview
on:
  push:
    branches: [test/mobile-browser-preview]
  workflow_dispatch:
permissions:
  contents: read
env:
  CAMERA_CHECK: ${{ contains(github.event.head_commit.message, '[camera check]') }}
jobs:
  iphone:
    if: "!contains(github.event.head_commit.message, '[android only]')"
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Boot an installed iPhone simulator
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          echo "AXE_DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          udid=$(python3 - "$RUNNER_TEMP/devices.json" <<'PY'
          import json, sys
          items = json.load(open(sys.argv[1]))['devices']
          devices = [(tuple(map(int,k.split('.iOS-')[1].split('-'))), d['name'], d['udid'])
                     for k, ds in items.items() if '.iOS-' in k for d in ds if d['name'].startswith('iPhone')]
          version, name, udid = max(devices, key=lambda row: (row[0], row[1] == 'iPhone 17', row[1] == 'iPhone 16', row[1]))
          print('Using',name,version,file=sys.stderr)
          print(udid)
          PY
          )
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          sim="$(xcode-select -p)/Applications/Simulator.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$sim"
          open -a "$sim"
          xcrun simctl bootstatus "$udid" -b
      - name: Run Safari on the iPhone simulator
        run: |
          brew install cameroncooke/axe/axe
          export NATIVE_IOS=1
          sudo safaridriver --enable
          safaridriver -p 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
          trap 'cat "$RUNNER_TEMP/safaridriver.log"' EXIT
          node preview/tests/mobile/run.mjs ios
      - name: Decode the exported video
        if: "!cancelled() && hashFiles('mobile-test-results/*pass-the-movie*') != ''"
        run: |
          if ! command -v ffprobe; then brew install ffmpeg; fi
          python3 preview/tests/mobile/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: iphone-simulator, path: mobile-test-results, retention-days: 3}
  android:
    if: "!contains(github.event.head_commit.message, '[ios only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Boot a Pixel emulator with Chrome
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod 666 /dev/kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=mobile
          pactl set-default-sink mobile
          image="system-images;android-36;google_apis_playstore;x86_64"
          "$sdkmanager" --install "platform-tools" "emulator" "$image"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/mobile-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n movie -k "$image" --device pixel_5
          if [[ ! -f "$ANDROID_AVD_HOME/movie.ini" ]]; then
            ini=$(find "$HOME" "$RUNNER_TEMP" -name movie.ini -type f -print -quit)
            test -n "$ini"
            export ANDROID_AVD_HOME=$(dirname "$ini")
          fi
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x movie
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/adbkey" ]]; then adb keygen "$HOME/.android/adbkey"; fi
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd movie -memory 2048 -cores 2 -no-window -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'tail -60 "$RUNNER_TEMP/emulator.log"' ERR
          emupid=$!
          for n in {1..45}; do kill -0 "$emupid"; if adb devices | grep -q 'emulator-'; then break; fi; sleep 2; done
          timeout 90 adb wait-for-device
          for n in {1..120}; do if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]]; then break; fi; sleep 2; done
          adb shell wm size 720x1280
          adb shell wm density 280
          adb shell getprop ro.build.version.release
          adb shell input keyevent 82
          adb shell pm path com.android.chrome | grep package:
          adb shell am set-debug-app --persistent com.android.chrome
          adb shell "echo 'chrome --disable-fre --no-first-run --no-default-browser-check' > /data/local/tmp/chrome-command-line"
          adb shell am start -a android.intent.action.VIEW -d about:blank -n com.android.chrome/com.google.android.apps.chrome.Main
          adb forward tcp:9222 localabstract:chrome_devtools_remote
          for n in {1..45}; do if curl -fsS http://127.0.0.1:9222/json/version; then break; fi; sleep 2; done
          curl -fsS http://127.0.0.1:9222/json/version
      - name: Run Chrome on the Android emulator
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile" --no-audit --no-fund playwright-core@1.56.1
          ln -s "$RUNNER_TEMP/mobile/node_modules" preview/tests/mobile/node_modules
          node preview/tests/mobile/run.mjs android
      - name: Decode the exported video
        if: "!cancelled() && hashFiles('mobile-test-results/*pass-the-movie*') != ''"
        run: |
          if ! command -v ffprobe; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python3 preview/tests/mobile/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: android-emulator, path: mobile-test-results, retention-days: 3}
