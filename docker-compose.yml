# LOCAL DEVELOPMENT ONLY: services exposed to loopback, no production credentials.
services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID:?Set local storage username in .env}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY:?Set local storage password in .env}
    volumes:
      - storage_data:/data
volumes:
  mongo_data:
  storage_data:
